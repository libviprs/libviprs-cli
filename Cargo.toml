[package]
name = "libviprs-cli"
version = "0.3.0"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
rust-version = "1.85"

[lints.rust]
deprecated = "deny"

[lints.clippy]
incompatible_msrv = "warn"

[[bin]]
name = "viprs"
path = "src/main.rs"

[features]
default = ["pdfium"]
# Vector-PDF rasterisation via PDFium (`viprs pyramid <file>.pdf --render`).
# On by default so the shipped binary keeps the `--render` path; build with
# `--no-default-features` to produce a pdfium-free binary that links no
# `pdfium-render`/native `libpdfium` (embedded-image extraction and `pdf`
# info still work — those are pure-Rust `lopdf` paths). Enables the core
# crate's `pdfium` feature, which is what pulls in `pdfium-render`.
pdfium = ["libviprs/pdfium"]
s3 = ["libviprs/s3"]
packfile = ["libviprs/packfile"]
tracing = ["libviprs/tracing", "dep:tracing-subscriber", "dep:tracing"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libviprs = { path = "../libviprs" }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
# Mirror the core crate's `pdfium-render` thread-safety fork. `[patch]`
# tables apply only from the build-root manifest, so the pin in
# `../libviprs/Cargo.toml` does not reach this crate when it is the
# build root — this crate resolves the unpatched `pdfium-render 0.8.37`
# from crates.io, whose `ThreadSafePdfiumBindings` acquires the pdfium
# global mutex only once on `FPDF_InitLibrary` and bypasses it for
# every other call, segfaulting under concurrent access to a shared
# `Pdfium`. Keep this pin in lockstep with `../libviprs/Cargo.toml`;
# drop both once the fork is upstreamed and released.
[patch.crates-io]
pdfium-render = { git = "https://github.com/libviprs/pdfium-render.git", branch = "libviprs/integration" }
