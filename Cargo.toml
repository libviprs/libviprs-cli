[package]
name = "libviprs-cli"
version = "0.6.0"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
rust-version = "1.99"

[lints.rust]
deprecated = "deny"

[lints.clippy]
incompatible_msrv = "warn"

[[bin]]
name = "viprs"
path = "src/main.rs"

[features]
default = ["pdfium"]
# Vector-PDF rasterisation via PDFium (`viprs pyramid <file>.pdf --render`).
# On by default so the shipped binary keeps the `--render` path; build with
# `--no-default-features` to produce a pdfium-free binary that links no
# `pdfium-render`/native `libpdfium` (embedded-image extraction and `pdf`
# info still work — those are pure-Rust `lopdf` paths). Enables the core
# crate's `pdfium` feature, which is what pulls in `pdfium-render`.
pdfium = ["libviprs/pdfium"]
# Links PDFium statically rather than binding `libpdfium.so` at runtime. The
# link needs a static `libpdfium.a` and `PDFIUM_STATIC_LIB_PATH` pointing at
# it (see the pdfium-render docs), which is why it is not in `full` below.
pdfium-static = ["pdfium", "libviprs/pdfium-static"]
s3 = ["libviprs/s3"]
# The injected-backend object-store seam on its own. `s3` is the core's
# deprecated alias for it and stays here for the `s3://` sink arm, but a build
# that wants the seam should not have to ask for S3 by name to get it.
object-store-sink = ["libviprs/object-store-sink"]
packfile = ["libviprs/packfile"]
tracing = ["libviprs/tracing", "dep:tracing-subscriber", "dep:tracing"]
# The four decoders the core keeps off by default. Without one, viprs refuses
# that format with exit 1 and a message naming the feature to rebuild with
# (`src/input.rs`), and `viprs features` says which ones this binary has.
avif = ["libviprs/avif"]
svg = ["libviprs/svg"]
jxl = ["libviprs/jxl"]
jp2k = ["libviprs/jp2k"]
# Everything above except `pdfium-static`, which trades the runtime-binding
# pdfium path for a link-time one and cannot be on for a build that has no
# static libpdfium to link.
full = [
    "pdfium",
    "s3",
    "object-store-sink",
    "packfile",
    "tracing",
    "avif",
    "svg",
    "jxl",
    "jp2k",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# SIGINT -> CancelToken, so Ctrl-C stops a pyramid at a tile boundary and
# leaves a job `--resume` can finish (libviprs-cli#66).
ctrlc = "3"
libviprs = "0.6"
serde_json = { version = "1", features = ["preserve_order"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
