[package]
name = "libviprs-cli"
version = "0.6.1"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
rust-version = "1.99"

[lints.rust]
deprecated = "deny"

[lints.clippy]
incompatible_msrv = "warn"

[[bin]]
name = "viprs"
path = "src/main.rs"

[features]
default = ["pdfium", "pvec-raster"]
# Vector-PDF rasterisation via PDFium (`viprs pyramid <file>.pdf --render`).
# On by default so the shipped binary keeps the `--render` path; build with
# `--no-default-features` to produce a pdfium-free (and pvec-free) binary that links no
# `pdfium-render`/native `libpdfium` (embedded-image extraction and `pdf`
# info still work — those are pure-Rust `lopdf` paths). Enables the core
# crate's `pdfium` feature, which is what pulls in `pdfium-render`.
pdfium = ["libviprs/pdfium"]
# Links PDFium statically rather than binding `libpdfium.so` at runtime. The
# link needs a static `libpdfium.a` and `PDFIUM_STATIC_LIB_PATH` pointing at
# it (see the pdfium-render docs), which is why it is not in `full` below.
pdfium-static = ["pdfium", "libviprs/pdfium-static"]
s3 = ["libviprs/s3"]
# The injected-backend object-store seam on its own. `s3` is the core's
# deprecated alias for it and stays here for the `s3://` sink arm, but a build
# that wants the seam should not have to ask for S3 by name to get it.
object-store-sink = ["libviprs/object-store-sink"]
packfile = ["libviprs/packfile"]
tracing = ["libviprs/tracing", "dep:tracing-subscriber", "dep:tracing"]
# The four decoders the core keeps off by default. Without one, viprs refuses
# that format with exit 1 and a message naming the feature to rebuild with
# (`src/input.rs`), and `viprs features` says which ones this binary has.
avif = ["libviprs/avif"]
svg = ["libviprs/svg"]
jxl = ["libviprs/jxl"]
jp2k = ["libviprs/jp2k"]
# The DWG reader behind `viprs vector views|build|report`: ACadSharp through
# `acadsharp-rs`, over a NativeAOT archive that crate's build script links (it
# finds one through ACADSHARP_NATIVE_DIR and downloads nothing). Without this
# feature those three commands exit 1 and name it; `vector info` and `vector
# validate` read a PMTiles file and work either way.
dwg-acadsharp = ["libviprs/dwg-acadsharp"]
# The `.pvec` raster commands: `viprs pyramid --storage pvec`, `viprs pmtiles to-pvec` and
# `viprs pvec rasters`. On by default, since PVec is public and the crates are plain git
# dependencies that fetch with no token. A `--no-default-features` build leaves them out; those
# commands then exit 1 and name this feature, and every usage error they have is still reported
# (exit 2).
pvec-raster = ["libviprs/pvec-raster", "dep:pvec-facade", "dep:pvec-capabilities"]
# Everything above except `pdfium-static`, which trades the runtime-binding
# pdfium path for a link-time one and cannot be on for a build that has no
# static libpdfium to link.
full = [
    "pdfium",
    "s3",
    "object-store-sink",
    "packfile",
    "tracing",
    "avif",
    "svg",
    "jxl",
    "jp2k",
    "dwg-acadsharp",
    "pvec-raster",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# SIGINT -> CancelToken, so Ctrl-C stops a pyramid at a tile boundary and
# leaves a job `--resume` can finish (libviprs-cli#66).
ctrlc = "3"
# The vector path (`viprs vector`, libviprs#1035) is not in a release of the
# core yet, so this points at the core branch that carries it (stacked on the
# hardening branch of libviprs#1245). It has to become a crates.io version once
# the core releases, and this crate cannot merge before that.
libviprs = { git = "https://github.com/libviprs/libviprs", rev = "09cca562d457e53d5f3483cd42ef3a8afd1f4c31" }
# PVec's facade and capability registry, for `viprs pyramid --storage pvec`, `viprs pmtiles
# to-pvec` and `viprs pvec rasters` (libviprs-cli#130). The revision is the one the core pins
# (`pvec-facade` in libviprs's own Cargo.toml), so both name one `PvecWriter`; moving it means
# moving the core's first. PVec is public, so these are plain git dependencies, and the
# `pvec-raster` feature that enables them is a default one (libviprs-cli#134).
pvec-facade = { package = "pvec", git = "https://github.com/libviprs/pvec", rev = "ff67ecb85b5367c5db56f7d03f162c02437414a8", features = ["unstable-stream"], optional = true }
pvec-capabilities = { git = "https://github.com/libviprs/pvec", rev = "ff67ecb85b5367c5db56f7d03f162c02437414a8", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
# The tests build the drawings the raster joins; the facade does not re-export the curve
# constructors. Same revision as the facade above.
pvec-geometry = { git = "https://github.com/libviprs/pvec", rev = "ff67ecb85b5367c5db56f7d03f162c02437414a8" }
