[package]
name = "libviprs-cli"
version = "0.6.1"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
rust-version = "1.99"

[lints.rust]
deprecated = "deny"

[lints.clippy]
incompatible_msrv = "warn"

[[bin]]
name = "viprs"
path = "src/main.rs"

[features]
default = ["pdfium", "pvec-raster", "dwg-acadrust", "pvec-convert"]
# Vector-PDF rasterisation via PDFium (`viprs pyramid <file>.pdf --render`).
# On by default so the shipped binary keeps the `--render` path; build with
# `--no-default-features` to produce a pdfium-free (and pvec-free) binary that links no
# `pdfium-render`/native `libpdfium` (embedded-image extraction and `pdf`
# info still work — those are pure-Rust `lopdf` paths). Enables the core
# crate's `pdfium` feature, which is what pulls in `pdfium-render`.
pdfium = ["libviprs/pdfium"]
# Links PDFium statically rather than binding `libpdfium.so` at runtime. The
# link needs a static `libpdfium.a` and `PDFIUM_STATIC_LIB_PATH` pointing at
# it (see the pdfium-render docs), which is why it is not in `full` below.
pdfium-static = ["pdfium", "libviprs/pdfium-static"]
s3 = ["libviprs/s3"]
# The injected-backend object-store seam on its own. `s3` is the core's
# deprecated alias for it and stays here for the `s3://` sink arm, but a build
# that wants the seam should not have to ask for S3 by name to get it.
object-store-sink = ["libviprs/object-store-sink"]
packfile = ["libviprs/packfile"]
tracing = ["libviprs/tracing", "dep:tracing-subscriber", "dep:tracing"]
# The four decoders the core keeps off by default. Without one, viprs refuses
# that format with exit 1 and a message naming the feature to rebuild with
# (`src/input.rs`), and `viprs features` says which ones this binary has.
avif = ["libviprs/avif"]
svg = ["libviprs/svg"]
jxl = ["libviprs/jxl"]
jp2k = ["libviprs/jp2k"]
# The default DWG reader behind `viprs vector views|build|report`: the pure Rust
# acadrust reader, which needs no native library (libviprs-cli#140). It comes from
# libviprs's own fork, pinned by revision through the core and never from a registry.
# Without it, and without `dwg-acadsharp`, those three commands exit 1 and name the
# feature; `vector info` and `vector validate` read a PMTiles file and work either way.
dwg-acadrust = ["libviprs/dwg-acadrust"]
# The EXPERIMENTAL DWG reader, chosen with `viprs vector ... --provider acadsharp`:
# ACadSharp through `acadsharp-rs`, over a NativeAOT archive that crate's build script
# links (it finds one through ACADSHARP_NATIVE_DIR and downloads nothing). It stays in
# `full` so the native lane keeps compiling and running, but acadrust is the default.
dwg-acadsharp = ["libviprs/dwg-acadsharp"]
# The `.pvec` raster commands: `viprs pyramid --storage pvec`, `viprs pmtiles to-pvec` and
# `viprs pvec rasters`. On by default, since PVec is public and the crates are plain git
# dependencies that fetch with no token. A `--no-default-features` build leaves them out; those
# commands then exit 1 and name this feature, and every usage error they have is still reported
# (exit 2).
pvec-raster = [
    "libviprs/pvec-raster",
    "dep:pvec-facade",
    "dep:pvec-capabilities",
    "dep:pvec-container",
    "dep:pvec-components",
]
# `viprs pvec convert`: a DWG to one `.pvec` per paper layout, one layout, or model space
# (libviprs#1566). The core's `pvec-convert` brings its writer and the acadrust reader with it, so
# this turns `dwg-acadrust` on too. On by default; without it the command exits 1 and names it.
pvec-convert = ["libviprs/pvec-convert", "dwg-acadrust"]
# `viprs pvec thumbnail` and `viprs pvec convert --thumbnail`: a PNG of a sheet, strokes only (no
# text, no fills), from the core's `pvec::thumbnail` (libviprs#1629). It pulls the core's rasteriser
# in through `svg`, so it is in `full` and not in the default build; without it both exit 1 and name
# this feature, and a usage mistake is still exit 2 (libviprs-cli#150).
pvec-raster-thumbnail = ["libviprs/pvec-raster-thumbnail", "pvec-convert", "svg"]
# JBIG2 image streams in a PDF page for `viprs pvec convert PAGE.pdf` (libviprs-cli#151): the core's pure
# Rust decoder. Not in `default`, and not in `full` either: the core keeps it out of its own default until
# 24 hours of its fuzz target run clean, and `full` is what gets shipped and tested as "everything". Without
# it a page whose images are JBIG2 exits 1 and names this feature.
jbig2 = ["libviprs/jbig2"]
# Everything above except `pdfium-static` and `jbig2`. `pdfium-static` trades the runtime-binding
# pdfium path for a link-time one and cannot be on for a build that has no
# static libpdfium to link.
full = [
    "pdfium",
    "s3",
    "object-store-sink",
    "packfile",
    "tracing",
    "avif",
    "svg",
    "jxl",
    "jp2k",
    "dwg-acadrust",
    "dwg-acadsharp",
    "pvec-raster",
    "pvec-convert",
    "pvec-raster-thumbnail",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# SIGINT -> CancelToken, so Ctrl-C stops a pyramid at a tile boundary and
# leaves a job `--resume` can finish (libviprs-cli#66).
ctrlc = "3"
# The vector path (`viprs vector`, libviprs#1035) is not in a release of the
# core yet, so this pins a core commit that carries it, and the acadrust decoder
# and `decoder_for` (libviprs#1485), and `PvecLayoutSet` for `viprs pvec convert` (libviprs#1564).
# Pinned by rev; never from a registry. The core's own
# default features are off here, so `dwg-acadrust` above is what turns the
# default reader on, the way `pdfium` does for PDFium.
libviprs = { git = "https://github.com/libviprs/libviprs", rev = "4b443f2f81e2701559127904a9008c09387c5122", default-features = false }
# PVec's facade and capability registry, for `viprs pyramid --storage pvec`, `viprs pmtiles
# to-pvec` and `viprs pvec rasters` (libviprs-cli#130). The revision is the one the core pins
# (`pvec-facade` in libviprs's own Cargo.toml), so both name one `PvecWriter`; moving it means
# moving the core's first. PVec is public, so these are plain git dependencies, and the
# `pvec-raster` feature that enables them is a default one (libviprs-cli#134).
pvec-facade = { package = "pvec", git = "https://github.com/libviprs/pvec", rev = "e1a768ba53b0fc4d530fc8b528c04159299c6f10", features = ["unstable-stream"], optional = true }
pvec-capabilities = { git = "https://github.com/libviprs/pvec", rev = "e1a768ba53b0fc4d530fc8b528c04159299c6f10", optional = true }
# `viprs pvec validate` (libviprs-cli#148) gives PVec's own verdict, which is the container's
# validation (structure, limits, block checksums, the artifact digest, each raster's tiles) and the
# calibration's CAL-11 residual check. The facade exposes neither, so these two name the crates
# that do. Same revision as the facade, and both were already in the lock through it.
pvec-container = { git = "https://github.com/libviprs/pvec", rev = "e1a768ba53b0fc4d530fc8b528c04159299c6f10", optional = true }
pvec-components = { git = "https://github.com/libviprs/pvec", rev = "e1a768ba53b0fc4d530fc8b528c04159299c6f10", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
# The tests build the drawings the raster joins; the facade does not re-export the curve
# constructors. Same revision as the facade above.
pvec-geometry = { git = "https://github.com/libviprs/pvec", rev = "e1a768ba53b0fc4d530fc8b528c04159299c6f10" }
# PVec's own validator, the oracle `pvec validate` is held to (libviprs-cli#148): the `pvec`
# command line tool's library half, called from the tests and never from viprs, so the verdict
# the tests compare against is PVec's code and not a copy of viprs's calls.
pvec-conformance = { git = "https://github.com/libviprs/pvec", rev = "e1a768ba53b0fc4d530fc8b528c04159299c6f10" }
# PVec's hostile raster corpus: a file whose only fault is a tile the reader refuses.
pvec-testkit = { git = "https://github.com/libviprs/pvec", rev = "e1a768ba53b0fc4d530fc8b528c04159299c6f10" }
