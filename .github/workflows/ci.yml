name: CI

# Runs natively on GitHub Actions. Every push to any branch gets a run, so a
# push to a PR branch always produces a signal (libviprs/libviprs#585).

on:
  push:
    branches: ['**']
  # Every job clones libviprs at whatever `main` is, so the library under this
  # crate moves without a commit here to notice, and push-only triggers mean
  # nothing runs until somebody pushes. #46 was that coupling biting: a core
  # change made this crate stop compiling and libviprs-tests could not build a
  # `viprs` binary at all. A nightly reports the drift while it is one day
  # wide (#50). 06:11 UTC stays clear of libviprs-bench's nightly at 05:31.
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone libviprs (matching branch or main)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" https://github.com/${{ github.repository_owner }}/libviprs.git ../libviprs 2>/dev/null \
            || git clone --depth 1 https://github.com/${{ github.repository_owner }}/libviprs.git ../libviprs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings -W clippy::incompatible_msrv -W deprecated
      # The pass above compiles the default configuration and nothing else, so
      # the three feature-gated arms in src/main.rs (tracing at 634, s3 at
      # 1057, packfile at 1091) were type-checked by no job at all, and neither
      # were the `#[cfg(not(feature = "pdfium"))]` halves that the manifest
      # tells people to build with --no-default-features. One cell each, same
      # flags as above, so every configuration this crate ships gets linted
      # (issue #48). Same hole the core closed for itself in libviprs#816.
      - run: cargo clippy --all-targets --features tracing -- -D warnings -W clippy::incompatible_msrv -W deprecated
      - run: cargo clippy --all-targets --features packfile -- -D warnings -W clippy::incompatible_msrv -W deprecated
      - run: cargo clippy --all-targets --features s3 -- -D warnings -W clippy::incompatible_msrv -W deprecated
      - run: cargo clippy --all-targets --no-default-features -- -D warnings -W clippy::incompatible_msrv -W deprecated

  # 1.97 is the core's MSRV, and this crate is a thin driver for it, so the
  # floor cannot be lower than the library it links (issue #43). The guard
  # below is the point of the job as much as the check is: the pin, the
  # `rust-version` in Cargo.toml and the README badge drifted apart once
  # already and nothing noticed for a month.
  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone libviprs (matching branch or main)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" https://github.com/${{ github.repository_owner }}/libviprs.git ../libviprs 2>/dev/null \
            || git clone --depth 1 https://github.com/${{ github.repository_owner }}/libviprs.git ../libviprs
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - name: Every MSRV claim agrees
        run: |
          declared=$(grep -m1 -E '^rust-version *= *"' Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/' | cut -d. -f1,2)
          core=$(grep -m1 -E '^rust-version *= *"' ../libviprs/Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/' | cut -d. -f1,2)
          pinned=$(rustc --version | sed -E 's/^rustc ([0-9]+\.[0-9]+).*/\1/')
          advertised=$(grep -oE 'rust-[0-9]+\.[0-9]+%2B|Rust [0-9]+\.[0-9]+\+' README.md \
            | grep -oE '[0-9]+\.[0-9]+' | sort -u | paste -sd/ -)
          echo "declared (Cargo.toml): $declared"
          echo "pinned (this job):     $pinned"
          echo "advertised (README):   $advertised"
          echo "core (libviprs):       $core"
          rc=0
          [ "$declared" = "$pinned" ] || { echo "::error::this job installs $pinned but Cargo.toml declares rust-version $declared"; rc=1; }
          [ "$declared" = "$advertised" ] || { echo "::error::README advertises Rust $advertised+ but Cargo.toml declares $declared"; rc=1; }
          [ "$(printf '%s\n%s\n' "$core" "$declared" | sort -V | tail -1)" = "$declared" ] \
            || { echo "::error::libviprs needs $core, above the $declared this crate declares"; rc=1; }
          exit $rc
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone libviprs (matching branch or main)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" https://github.com/${{ github.repository_owner }}/libviprs.git ../libviprs 2>/dev/null \
            || git clone --depth 1 https://github.com/${{ github.repository_owner }}/libviprs.git ../libviprs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
